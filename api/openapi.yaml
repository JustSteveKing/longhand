    RequestState:
      type: string
      enum:
      - draft
      - pending
      - accepted
      - declined
      - done
      - cancelled
    Request:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      - links
      properties:
        type:
          type: string
          const: requests
        id:
          $ref: '#/components/schemas/RequestId'
        attributes:
          type: object
          required:
          - state
          - due_by
          - done_when
          - proposed_due_by
          - lands_at
          - overdue
          - created_at
          properties:
            state:
              $ref: '#/components/schemas/RequestState'
            due_by:
              $ref: '#/components/schemas/Timestamp'
            done_when:
              type:
              - string
              - 'null'
              maxLength: 500
              description: What finished looks like.
            proposed_due_by:
              type:
              - string
              - 'null'
              format: date-time
              description: A due date the assignee has proposed and the requester has not yet answered.
            lands_at:
              type:
              - string
              - 'null'
              format: date-time
              description: When the assignee will see it (RFC 0006).
            overdue:
              type: boolean
              description: True once `due_by` has passed while `pending` or `accepted`. A fact about time,
                not a state.
            created_at:
              $ref: '#/components/schemas/Timestamp'
        relationships:
          type: object
          required:
          - post
          - thread
          - requester
          - assignee
          - transitions
          properties:
            post:
              $ref: '#/components/schemas/ToOneRequired'
            thread:
              $ref: '#/components/schemas/ToOneRequired'
            requester:
              $ref: '#/components/schemas/ToOneRequired'
            assignee:
              $ref: '#/components/schemas/ToOneRequired'
            transitions:
              $ref: '#/components/schemas/ToManyLinkOnly'
        links:
          $ref: '#/components/schemas/SelfLinks'
    RequestDocument:
      type: object
      required:
      - jsonapi
      - data
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          $ref: '#/components/schemas/Request'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    RequestCollectionDocument:
      type: object
      required:
