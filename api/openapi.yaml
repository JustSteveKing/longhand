  /check-in-responses:
    post:
      operationId: respondToCheckInRun
      tags:
      - Check-ins
      summary: Answer a run, or say there is nothing to report
      description: 'As action `check_in.respond`, by anyone asked in the run (RFC 0008,

        ADR 0042). Every required question needs an answer, and each

        answer''s `key` must be one of the run''s questions. Longhand writes

        one `update` post with every `update` answer under its question, and

        one `question` post per `blocker` answer replying to it, routed to

        anyone it mentions or else to the check-in''s owner. The created posts

        are in the response''s `posts` relationship; changing an answer

        afterwards is editing those posts.


        `nothing_to_report: true` with no answers posts nothing, closes the

        caller''s inbox item, and counts as an answer. After someone''s window

        has ended they can still answer while the run''s thread is open; the

        response is marked `late`.


        A member not asked in the run is `403` `not-a-respondent`. A second

        response from the same person is `409` `resource-conflict`. Answering

        after the run''s thread has resolved is `409` `thread-not-open`.

        '
