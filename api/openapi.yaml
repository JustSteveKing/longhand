  /requests:
    get:
      operationId: listRequests
      tags:
      - Requests
      summary: List requests across visible threads
      description: 'Requests in every thread the caller can see (RFC 0005). What a

        person owes is `filter[assignee]=me&filter[state]=pending,accepted`;

        what they are waiting on is `filter[requester]=me` with the same

        states. A delegated agent''s `me` is its principal (RFC 0003).

        Draft requests are listed only for those who can see their draft

        post.

        '
      security:
      - oauth2:
        - threads:read
      parameters:
      - name: filter[assignee]
        in: query
        description: Member IDs, comma separated, or `me`.
        schema:
          type: string
      - name: filter[requester]
        in: query
        description: Member IDs, comma separated, or `me`.
        schema:
          type: string
      - name: filter[state]
        in: query
        description: Comma separated states, matching any.
        schema:
          type: string
          examples:
          - pending,accepted
      - name: filter[thread]
        in: query
        description: Thread IDs, comma separated.
        schema:
          type: string
      - name: filter[space]
        in: query
        description: Space IDs, comma separated.
        schema:
          type: string
      - name: filter[overdue]
        in: query
        schema:
          type: boolean
      - name: filter[due_before]
        in: query
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: sort
        in: query
        description: Defaults to `due_by`, soonest first.
        schema:
          type: string
          enum:
          - due_by
          - -due_by
          - created_at
          - -created_at
          default: due_by
      - name: include
        in: query
        description: Any of `post`, `thread`, `requester`, `assignee`.
        schema:
          type: string
        style: form
        explode: false
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageAfter'
      - $ref: '#/components/parameters/PageBefore'
      responses:
        '200':
          description: A page of requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RequestCollectionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createRequestNotAllowed
      tags:
      - Requests
      summary: Not supported; requests are created with their post
      description: 'There is no `POST /v1/requests` (RFC 0005). A request is created

        together with its `request` intent post through `POST /v1/operations`

        (ADR 0022). This answers `405` `method-not-allowed` with `Allow: GET`,

        and the error''s `detail` points at `/v1/operations`.

        '
      security:
      - oauth2:
        - requests:write
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
