    InboxItemReason:
      type: string
      description: Why the item is in the inbox, from the routing table in RFC 0006 (ADR 0033).
      enum:
      - mentioned
      - question_asked
      - request_assigned
      - update_posted
      - request_completed
      - request_declined
      - request_overdue
      - request_needs_reassignment
      - due_by_proposed
      - question_unmarked
      - decision_needed
      - draft_awaiting_approval
      - thread_stale
      - thread_reopened
      - check_in_due
      - brief_flagged
      - webhook_disabled
      - subscription_pending
      - subscription_reviewed
    InboxItemState:
      type: string
      description: Scheduled items exist but are never returned to their member (ADR 0034).
      enum:
      - open
      - snoozed
      - done
    InboxItem:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      - links
      properties:
        type:
          type: string
          const: inbox_items
        id:
          $ref: '#/components/schemas/InboxItemId'
        attributes:
          type: object
          required:
          - reason
          - tier
          - state
          - due_by
          - deliver_at
          - delivered_at
          - snoozed_until
          - done_at
          - done_cause
          properties:
            reason:
              $ref: '#/components/schemas/InboxItemReason'
            tier:
              $ref: '#/components/schemas/Urgency'
            state:
              $ref: '#/components/schemas/InboxItemState'
            due_by:
              oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
            deliver_at:
              $ref: '#/components/schemas/Timestamp'
            delivered_at:
              $ref: '#/components/schemas/Timestamp'
            snoozed_until:
              oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
            done_at:
              oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
            done_cause:
              type:
              - string
              - 'null'
              description: 'Why the item closed: `member` when closed by hand, otherwise what settled
                it. `null` while the item is open or snoozed.'
              enum:
              - member
              - request_accepted
              - request_declined
              - request_completed
              - request_cancelled
              - request_reassigned
              - question_answered
              - draft_published
              - draft_discarded
              - thread_resolved
              - thread_archived
              - access_lost
              - run_closed
              - null
        relationships:
          type: object
          required:
          - member
          - subject
          - thread
          - from
          properties:
            member:
              $ref: '#/components/schemas/ToOneRequired'
            subject:
              description: What the item is about, a request, post, thread, decision, brief, check-in
                run or subscription.
              $ref: '#/components/schemas/ToOneRequired'
            thread:
              $ref: '#/components/schemas/ToOne'
            from:
              $ref: '#/components/schemas/ToOne'
        links:
          $ref: '#/components/schemas/SelfLinks'
    InboxItemDocument:
      type: object
