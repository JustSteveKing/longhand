webhooks:
  cloudEvent:
    post:
      operationId: receiveCloudEvent
      tags:
      - Events
      summary: An event delivered to a subscription
      description: 'RFC 0010, ADR 0051, ADR 0052. What a subscription''s URL receives:

        one CloudEvent per request, rendered with the visibility of the

        subscription''s `delivers_as` member when it is delivered.


        Deliveries are signed with Standard Webhooks: HMAC-SHA256 over

        `{webhook-id}.{webhook-timestamp}.{body}` with the subscription''s

        secret. During a secret rotation, `webhook-signature` carries both

        signatures, space separated.


        Any `2xx` within 10 seconds is success. Delivery is at least once:

        failures retry with exponential backoff and jitter for up to 3

        days, after which the subscription is disabled. Redirects are not

        followed. Consumers deduplicate on the event `id`, and keep the

        newest state per subject, since ordering is not guaranteed.

        '
      parameters:
      - name: webhook-id
        in: header
        required: true
        description: The event `id`, the same on every retry.
        schema:
          $ref: '#/components/schemas/EventId'
      - name: webhook-timestamp
        in: header
        required: true
        description: Unix seconds when this attempt was signed.
        schema:
          type: integer
      - name: webhook-signature
        in: header
        required: true
        description: One or more `v1,{base64 signature}` values, space separated.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/CloudEvent'
            examples:
              requestCompleted:
                value:
                  specversion: '1.0'
                  type: longhand.request.completed
                  source: urn:longhand:workspace:wsp_01J8000000000000000000000A
                  id: evt_01JAC30000000000000000000A
                  time: '2026-10-09T10:14:00Z'
                  subject: req_01JAA40000000000000000000A
                  datacontenttype: application/json
                  dataschema: https://api.longhand.example/schemas/v1/events/request.completed.json
                  actor: mem_01JA7R0000000000000000000A
                  actorkind: human
                  onbehalfof: null
                  surface: rest
                  data:
                    resource:
                      type: requests
                      id: req_01JAA40000000000000000000A
                      attributes:
                        state: done
                      links:
                        self: https://api.longhand.example/v1/requests/req_01JAA40000000000000000000A
                    previous:
                      state: accepted
                    note: Reviewed and merged
      responses:
        2XX:
          description: Received. Must be returned within 10 seconds.
