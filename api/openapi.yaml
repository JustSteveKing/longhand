      description: RFC 0010, ADR 0052. Action `subscription.create`. Any non-guest member may create one
        that delivers as themselves or an agent they own; owners and admins may deliver as any member.
        A member's subscription starts `pending` and sends nothing until an owner or admin approves it,
        unless the workspace's `subscription_approval` setting is off; owners' and admins' own subscriptions
