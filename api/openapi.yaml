openapi: 3.1.0
info:
  title: Longhand API
  version: 1.0.0
  summary: The REST contract for Longhand, an async-first workspace for remote teams and their agents.
  description: "Written by hand from the accepted RFCs in `docs/rfc/`, which are the\nsource of truth:\
    \ where this document and an accepted RFC disagree, the\nRFC is right and this document is the bug.\n\
    \nEvery request and response body is a JSON:API 1.1 document with the\nmedia type `application/vnd.api+json`\
    \ (ADR 0004), except the event\nstream (`text/event-stream`) and upload targets. Errors are JSON:API\n\
    error objects whose `code` comes from the apiguide.dev catalogue or,\nfor errors only Longhand has,\
    \ from `https://api.longhand.example/problems/{code}`\n(ADR 0005), which is not published until Longhand\
    \ has a real domain.\n\nConventions that apply everywhere, defined once in RFC 0002:\n\n- Identifiers\
    \ are server-generated prefixed ULIDs (ADR 0007).\n- Every `POST` accepts `Idempotency-Key` (ADR 0010).\n\
    - Every `PATCH` and `DELETE` of a mutable resource requires `If-Match`\n  with the resource's `ETag`\
    \ (ADR 0011); appends and immutable\n  resources do not.\n- A resource the caller cannot see is `404`,\
    \ never `403` (ADR 0012).\n- State changes are `PATCH`es of a resource's state; actions that\n  produce\
    \ a resource are creates (ADR 0013).\n- Collections use the JSON:API cursor pagination profile (ADR\
    \ 0008),\n  and unknown parameters, includes or sorts are `400` (ADR 0009).\n- Creates that need several\
    \ resources go through\n  `POST /v1/operations` with the Atomic Operations extension (ADR 0022).\n\
    - Every response carries `X-Request-Id`, also as `meta.request_id`,\n  and the IETF `RateLimit` and\
    \ `RateLimit-Policy` headers.\n"
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.longhand.example/v1
  description: Documentation domain. Longhand has no real domain yet (ADR 0002).
security:
- oauth2: []
tags:
- name: Identity
  description: The caller, the workspace, members, agents, invitations and the audit log (RFC 0003).
- name: Spaces
  description: Spaces and their memberships (RFC 0004).
- name: Threads
  description: Threads, their lifecycle and read positions (RFC 0004).
- name: Posts
  description: Posts, revisions, reactions and uploads (RFC 0004).
- name: Operations
  description: Atomic operations for creates that need several resources (ADR 0022).
- name: Requests
  description: Requests and their transitions (RFC 0005).
- name: Decisions
  description: Decisions and the decision log (RFC 0005).
- name: Attention
  description: Availability, away periods, the inbox and digests (RFC 0006).
- name: Briefs
  description: Briefs, roll-ups and feedback (RFC 0007).
- name: Check-ins
  description: Check-ins, runs and responses (RFC 0008).
- name: Search
  description: Hybrid, keyword and semantic search (RFC 0009).
- name: Events
  description: Subscriptions, webhook deliveries, the events endpoint and the stream (RFC 0010).
paths:
  /me:
    get:
      operationId: getMe
      tags:
      - Identity
      summary: The caller's member
      description: The member the token belongs to, in the token's workspace (RFC 0003). Works with any
        valid token, whatever its scopes. For an agent acting on someone's behalf, this is the agent,
        with `acts_on_behalf_of` naming its principal.
      security:
      - oauth2: []
      responses:
        '200':
          description: The caller's member.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MemberDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /workspace:
    get:
      operationId: getWorkspace
      tags:
      - Identity
      summary: Read the workspace
      description: 'The token''s workspace, a singleton: workspace IDs never appear in URLs because a
        token belongs to one workspace (RFC 0003).'
      security:
      - oauth2:
        - workspace:read
      parameters:
      - name: include
        in: query
        description: 'Supported: `brief_generator`.'
        schema:
          type: string
          enum:
          - brief_generator
      responses:
        '200':
          description: The workspace.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkspaceDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateWorkspace
      tags:
      - Identity
      summary: Update the workspace
      description: 'Changes the workspace''s settings, as action `workspace.update`, by an owner or admin
        (RFC 0003). Only owners change the handle. The settings come from several RFCs: `brief_generator`
        and `brief_daily_limit` (RFC 0007), `semantic_search` (RFC 0009), `subscription_approval` (RFC
        0010) and `max_assistants_per_member` (RFC 0011). Email domains, and deleting the workspace, are
        web app only.'
      x-longhand-action: workspace.update
      security:
      - oauth2:
        - workspace:write
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdateDocument'
            example:
              data:
                type: workspaces
                id: wsp_01J8Z3Q4R5S6T7V8W9X0Y1Z2A3
                attributes:
                  brief_daily_limit: 50
                  semantic_search: false
      responses:
        '200':
          description: The updated workspace.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkspaceDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /members:
    get:
      operationId: listMembers
      tags:
      - Identity
      summary: List members
      description: Members of the workspace, human and agent (RFC 0003). Each carries its limited availability
        summary (RFC 0006). Ordered by `display_name` by default.
      security:
      - oauth2:
        - members:read
      parameters:
      - name: filter[kind]
        in: query
        description: '`human`, `agent`, or both, comma separated.'
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/MemberKind'
      - name: sort
        in: query
        description: Order of the results. Default `display_name`; the ULID is always the final key (RFC
          0002).
        schema:
          type: string
          enum:
          - display_name
          - -display_name
          - handle
          - -handle
          - created_at
          - -created_at
          default: display_name
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageAfter'
      - $ref: '#/components/parameters/PageBefore'
      responses:
        '200':
          description: A page of members.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MemberCollectionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createAgent
      tags:
      - Identity
      summary: Create an agent
      description: 'Creates an agent, a member with `kind: "agent"` (RFC 0003, ADR 0016). Humans are never
        created through the API; they join by invitation in the web app. A member creates agents they
        own; an admin can create one for any human member. Agents cannot create agents. The agent''s OAuth
        client credentials are issued now and returned once, in `meta.client_credentials`. Errors: `agent-limit-reached`
        (409) when the owner is at the workspace''s cap, `scope-exceeds-owner` (422) when a scope or space
        is beyond the owner''s, `resource-conflict` (409) for a duplicate handle.'
      x-longhand-action: agent.create
      security:
      - oauth2:
        - members:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AgentCreateDocument'
            example:
              data:
                type: members
                attributes:
                  kind: agent
                  display_name: Triage
                  handle: triage
                  description: Routes new support threads and drafts first replies
                  scopes:
                  - threads:read
                  - posts:write:draft
                  - requests:write
                  requires_approval_for:
                  - post.publish
                  - request.assign
                  model:
                    provider: anthropic
                    name: claude-sonnet-5-5
                relationships:
                  owner:
                    data:
                      type: members
                      id: mem_01JA7Q4R5S6T7V8W9X0Y1Z2A3B
                  spaces:
                    data:
                    - type: spaces
                      id: spc_01JA9S4R5S6T7V8W9X0Y1Z2A3B
      responses:
        '201':
          description: The agent, with its client credentials in `meta.client_credentials`, shown once.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AgentCredentialsDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /members/{member}:
    parameters:
    - name: member
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MemberId'
    get:
      operationId: getMember
      tags:
      - Identity
      summary: Read a member
      description: A member, human or agent (RFC 0003).
      security:
      - oauth2:
        - members:read
      responses:
        '200':
          description: The member.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MemberDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateMember
      tags:
      - Identity
      summary: Update a member
      description: 'Updates a member''s profile, role or status, or an agent''s scopes,

        approval rules, spaces, owner or delegation (RFC 0003). Status

        changes are the lifecycle transitions of ADR 0013:


        | From | To | Action | Who |

        | --- | --- | --- | --- |

        | `active` | `deactivated` | `member.deactivate` | An admin, or an owner for an owner. The member''s
        agents become `suspended` |

        | `deactivated` | `active` | `member.reactivate` | An admin |

        | `active` | `deactivated` | `member.leave` | The member themselves |

        | agent `active` | `suspended` | `agent.suspend` | The agent''s owner or an admin |

        | agent `suspended` | `active` | `agent.resume` | The owner or an admin, once the owner is active
        |


        Only owners invite or promote owners. Agents never change scopes,

        approval rules, spaces or roles, their own or anyone''s. Only the human

        named in `acts_on_behalf_of` sets it, on an agent they own. Changing

        an agent''s owner rechecks its scopes and spaces against the new

        owner, removing what they could not grant.


        A person editing their own profile (`display_name`, `handle`,

        `timezone`), as `member.update_profile`, or leaving, as

        `member.leave`, needs no scope: any human session or token will do.

        Agents cannot do either. Everything else needs `members:write`. A person''s assistant

        (RFC 0011) can switch `spaces_follow_principal` off to fix its

        spaces. Errors: `last-owner` (409), `agent-limit-reached` (409) on a

        transfer to a member at the cap, `scope-exceeds-owner` (422),

        `invalid-transition` (409), `resource-conflict` (409) for a duplicate

        handle.

        '
      x-longhand-action:
      - member.update_profile
      - member.change_role
      - member.deactivate
      - member.reactivate
      - member.leave
      - agent.configure
      - agent.transfer
      - agent.suspend
      - agent.resume
      security:
      - oauth2:
        - members:write
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/MemberUpdateDocument'
            examples:
              suspend:
                summary: Suspend an agent
                value:
                  data:
                    type: members
                    id: mem_01JA8T4R5S6T7V8W9X0Y1Z2A3B
                    attributes:
                      status: suspended
              transfer:
                summary: Transfer an agent to a new owner
                value:
                  data:
                    type: members
                    id: mem_01JA8T4R5S6T7V8W9X0Y1Z2A3B
                    relationships:
                      owner:
                        data:
                          type: members
                          id: mem_01JA7R4R5S6T7V8W9X0Y1Z2A3B
      responses:
        '200':
          description: The updated member.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MemberDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /members/{member}/credentials:
    parameters:
    - name: member
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MemberId'
    post:
      operationId: rotateAgentCredentials
      tags:
      - Identity
      summary: Rotate an agent's client secret
      description: Issues the agent a new OAuth client secret, returned once in `meta.client_credentials`
        (RFC 0003). Only for agents, by their owner or an admin; a human member is `404`.
      x-longhand-action: agent.rotate_credentials
      security:
      - oauth2:
        - members:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The agent, with its new client credentials in `meta.client_credentials`, shown
            once.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AgentCredentialsDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations:
    get:
      operationId: listInvitations
      tags:
      - Identity
      summary: List invitations
      description: The workspace's invitations (RFC 0003), for owners and admins. Newest first by default.
      security:
      - oauth2:
        - members:write
      parameters:
      - name: sort
        in: query
        description: Order of the results. Default `-created_at`; the ULID is always the final key (RFC
          0002).
        schema:
          type: string
          enum:
          - -created_at
          - created_at
          - expires_at
          - -expires_at
          default: -created_at
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageAfter'
      - $ref: '#/components/parameters/PageBefore'
      responses:
        '200':
          description: A page of invitations.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InvitationCollectionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createInvitation
      tags:
      - Identity
      summary: Invite someone
      description: Invites an email address to the workspace with a role and, for a guest, the spaces
        they are added to, as action `member.invite` (RFC 0003). Owners and admins invite; only owners
        invite as `owner`. An invitation is valid for 7 days and is accepted in the web app. Inviting
        an address that is already a member, or has a pending invitation, is `409` `resource-conflict`.
      x-longhand-action: member.invite
      security:
      - oauth2:
        - members:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/InvitationCreateDocument'
            example:
              data:
                type: invitations
                attributes:
                  email: priya@acme.example
                  role: guest
                relationships:
                  spaces:
                    data:
                    - type: spaces
                      id: spc_01JA9S4R5S6T7V8W9X0Y1Z2A3B
      responses:
        '201':
          description: The invitation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InvitationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations/{invitation}:
    parameters:
    - name: invitation
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/InvitationId'
    patch:
      operationId: resendInvitation
      tags:
      - Identity
      summary: Resend an invitation
      description: Resends a pending invitation (RFC 0003), sending the email again and moving `expires_at`
        to 7 days from now. An invitation that has been accepted, revoked or has expired cannot be resent
        (`409` `invalid-transition`).
      x-longhand-action: invitation.resend
      security:
      - oauth2:
        - members:write
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/InvitationUpdateDocument'
            example:
              data:
                type: invitations
                id: inv_01JAD84R5S6T7V8W9X0Y1Z2A3B
      responses:
        '200':
          description: The invitation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InvitationDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: revokeInvitation
      tags:
      - Identity
      summary: Revoke an invitation
      description: Revokes a pending invitation (RFC 0003), firing `invitation.revoked`. One that is no
        longer pending is `409` `invalid-transition`.
      x-longhand-action: invitation.revoke
      security:
      - oauth2:
        - members:write
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /audit-events:
    get:
      operationId: listAuditEvents
      tags:
      - Identity
      summary: The audit log
      description: 'Every action, newest first, including refused attempts, which have `outcome: refused`
        (RFC 0003, ADR 0021). Append-only: entries are never edited or deleted. Owners and admins only;
        `audit:read` can never be granted to an agent.'
      security:
      - oauth2:
        - audit:read
      parameters:
      - name: filter[actor]
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/MemberId'
      - name: filter[kind]
        in: query
        description: The actor's kind.
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/MemberKind'
      - name: filter[action]
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActionName'
      - name: filter[outcome]
        in: query
        schema:
          $ref: '#/components/schemas/AuditOutcome'
