    CloudEvent:
      type: object
      description: A CloudEvents 1.0 event in structured JSON mode (RFC 0010).
      required:
      - specversion
      - type
      - source
      - id
      - time
      - subject
      - datacontenttype
      - actor
      - actorkind
      - onbehalfof
      - surface
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        type:
          type: string
          pattern: ^longhand\.
          description: '`longhand.` plus the event name (ADR 0002).'
          examples:
          - longhand.request.completed
        source:
          type: string
          pattern: ^urn:longhand:workspace:wsp_
          description: A URN naming the workspace.
        id:
          $ref: '#/components/schemas/EventId'
        time:
          $ref: '#/components/schemas/Timestamp'
        subject:
          type: string
          description: The ID of the resource the event is about.
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
          format: uri
          description: Uses the documentation domain; not resolvable until Longhand has a real one.
        actor:
          description: The member who caused the event.
          oneOf:
          - $ref: '#/components/schemas/MemberId'
          - type: 'null'
        actorkind:
          oneOf:
          - $ref: '#/components/schemas/MemberKind'
          - type: 'null'
        onbehalfof:
          description: The member an agent acted for, if any.
          oneOf:
          - $ref: '#/components/schemas/MemberId'
          - type: 'null'
        surface:
          $ref: '#/components/schemas/Surface'
        data:
          $ref: '#/components/schemas/CloudEventData'
    CloudEventData:
      type: object
      description: The full resource as the recipient would see it, the attributes that changed with their
        old values, and any extras the event catalogues (`note`, `delivery`, `outcome` and so on) beside
        them.
      required:
      - resource
      properties:
        resource:
          $ref: '#/components/schemas/ResourceObject'
        previous:
          type: object
          description: Only the attributes that changed, with their old values.
          additionalProperties: true
      additionalProperties: true
    Event:
