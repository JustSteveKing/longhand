  /search:
    get:
      operationId: search
      tags:
      - Search
      summary: Search threads, posts and decisions
      description: 'Hybrid, keyword or semantic search over what the caller can see,

        with visibility applied in the same query as the match (RFC 0009,

        ADR 0045, ADR 0046). Drafts, deleted posts, draft threads and draft

        decisions are never found, nor check-in answers the caller cannot

        see yet (ADR 0043).


        Results are ordered by relevance, or by date with `sort`. Each

        result carries how it matched in its resource `meta`. Every

        result''s thread is always included, the one documented exception

        to `include` being opt-in (RFC 0002); `include` can add authors.

        Semantic and hybrid search return at most 200 matches in all.

        `hybrid` is the default mode (ADR 0048), combining keyword and

        semantic results by reciprocal rank fusion.


        `400` `invalid-query-parameter` when `filter[q]` is missing, over

        500 characters, or parses to nothing in keyword search (only stop

        words); when a filter applies to none of the requested types (such

        as `filter[intent]` or `filter[decision_status]` with only

        `threads`); or when

        `filter[mode]=semantic` or `hybrid` is used while the workspace has

        semantic search turned off. Semantic and hybrid queries are limited

        to 30 per minute per member, together, beyond the general limits:

        `429` `rate-limit-exceeded`.

        '
      security:
      - oauth2:
        - threads:read
      parameters:
      - name: filter[q]
        in: query
        required: true
        description: The query. In keyword matching, `"exact phrase"`, `-excluded` and `or` work as in
          a search box.
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - name: filter[mode]
        in: query
        description: How `filter[q]` matches. Defaults to `hybrid`, or to `keyword` when the workspace
          has semantic search off.
        schema:
          type: string
          enum:
          - hybrid
          - keyword
          - semantic
          default: hybrid
      - name: filter[type]
        in: query
        description: Any of `threads`, `posts`, `decisions`, comma separated. Defaults to all three.
        schema:
          type: string
      - name: filter[space]
        in: query
        description: Space IDs, comma separated.
        schema:
          type: string
      - name: filter[thread]
        in: query
        description: Thread IDs, comma separated.
        schema:
          type: string
      - name: filter[author]
        in: query
        description: Member IDs, comma separated. Posts by these members; decisions they decided.
        schema:
          type: string
      - name: filter[intent]
        in: query
        description: Post intents, comma separated. Applies to posts.
        schema:
          type: string
      - name: filter[thread_status]
        in: query
        description: Thread statuses, comma separated. Applies to threads.
        schema:
          type: string
      - name: filter[decision_status]
        in: query
        description: Decision statuses, comma separated. Applies to decisions.
        schema:
          type: string
      - name: filter[after]
        in: query
        description: Created after this time.
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: filter[before]
        in: query
        description: Created before this time.
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: sort
        in: query
        description: Omit for relevance; or order the matches by date.
        schema:
          type: string
          enum:
          - created_at
          - -created_at
      - name: include
        in: query
        description: '`thread` is always included. Also `author` for posts and `decided_by` for decisions.'
        schema:
          type: string
        style: form
        explode: false
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageAfter'
      - $ref: '#/components/parameters/PageBefore'
      responses:
        '200':
          description: A page of results.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SearchResultsDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
