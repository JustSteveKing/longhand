        meta:
          $ref: '#/components/schemas/DocumentMeta'
    DecisionStatus:
      type: string
      enum:
      - draft
      - active
      - superseded
    DecisionTag:
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      description: A lowercase word or hyphenated phrase.
    Decision:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      - links
      properties:
        type:
          type: string
          const: decisions
        id:
          $ref: '#/components/schemas/DecisionId'
        attributes:
          type: object
          required:
          - status
          - summary
          - rationale
          - tags
          - decided_at
          - created_at
          properties:
            status:
              $ref: '#/components/schemas/DecisionStatus'
            summary:
              type: string
              maxLength: 200
            rationale:
              description: The same Markdown object as a post's body, up to 10,000 characters; `null`
                when there is none.
              oneOf:
              - $ref: '#/components/schemas/DecisionRationale'
              - type: 'null'
            tags:
              type: array
              maxItems: 10
              items:
                $ref: '#/components/schemas/DecisionTag'
            decided_at:
              type:
              - string
              - 'null'
              format: date-time
              description: When it was published; `null` while a draft.
            created_at:
              $ref: '#/components/schemas/Timestamp'
        relationships:
          type: object
          required:
          - post
          - thread
          - decided_by
          - published_by
          - supersedes
          - superseded_by
          - chain
          properties:
            post:
              $ref: '#/components/schemas/ToOneRequired'
            thread:
              $ref: '#/components/schemas/ToOneRequired'
            decided_by:
              description: One or more humans; never an agent.
              allOf:
              - $ref: '#/components/schemas/ToMany'
            published_by:
              $ref: '#/components/schemas/ToOne'
            supersedes:
              $ref: '#/components/schemas/ToOne'
            superseded_by:
              $ref: '#/components/schemas/ToOne'
            chain:
              $ref: '#/components/schemas/ToManyLinkOnly'
        links:
          $ref: '#/components/schemas/SelfLinks'
        meta:
          $ref: '#/components/schemas/SearchResultMeta'
          description: Present on search results only.
    DecisionDocument:
      type: object
      required:
      - jsonapi
      - data
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          $ref: '#/components/schemas/Decision'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    DecisionCollectionDocument:
      type: object
      required:
      - jsonapi
      - data
      - links
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    DecisionUpdateDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - id
          properties:
            type:
              type: string
              const: decisions
            id:
              $ref: '#/components/schemas/DecisionId'
            attributes:
              type: object
              properties:
                status:
                  type: string
                  const: active
                  description: Publishes a draft.
                summary:
                  type: string
                  maxLength: 200
                rationale:
                  oneOf:
                  - $ref: '#/components/schemas/DecisionRationale'
                  - type: 'null'
                tags:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/DecisionTag'
            relationships:
              type: object
              properties:
                decided_by:
                  $ref: '#/components/schemas/ToMany'
    DecisionRationale:
      type: object
      description: Markdown, as a post's body (RFC 0004), with a shorter limit.
      required:
      - format
      - text
      properties:
        format:
          type: string
          const: markdown
        text:
          type: string
          maxLength: 10000
    SearchMatch:
      type: string
      enum:
      - keyword
      - semantic
    SearchResultMeta:
      type: object
      required:
      - score
      - highlight
      - matched
      properties:
        score:
          type: number
          description: Relative to this query only; meaningless across queries or modes.
        highlight:
          type: object
          required:
          - field
          - text
          - ranges
          properties:
            field:
              type: string
              description: The attribute the highlight comes from.
            text:
              type: string
              description: Plain text, never HTML. For a keyword match, the best fragment; for a semantic
                match, the passage that matched best.
            ranges:
              type: array
              description: Matched character ranges in `text`, as start and end offsets. Empty for a semantic
                match.
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: integer
                  minimum: 0
        matched:
          type: array
          description: How the result was found. In hybrid search, either or both.
          items:
            $ref: '#/components/schemas/SearchMatch'
    SearchResult:
      description: A thread, post or decision, with `meta` saying how it matched.
      oneOf:
      - $ref: '#/components/schemas/Thread'
      - $ref: '#/components/schemas/Post'
      - $ref: '#/components/schemas/Decision'
    SearchResultsDocument:
      type: object
      required:
      - jsonapi
      - data
      - links
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SearchResult'
        included:
          type: array
          description: Every result's thread, plus anything named in `include`.
          items:
            $ref: '#/components/schemas/ResourceObject'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    WorkingWindow:
      type: object
      description: A window in the member's local time. An `end` before its `start` crosses midnight.
      required:
      - days
      - start
      - end
      properties:
        days:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Weekday'
        start:
          $ref: '#/components/schemas/LocalTime'
        end:
          $ref: '#/components/schemas/LocalTime'
    AvailabilityDigestSchedule:
      type: object
      description: When the digest is made, in local time.
      required:
      - days
      - time
      properties:
        days:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Weekday'
        time:
          $ref: '#/components/schemas/LocalTime'
    AvailabilityEmail:
      type: object
      description: What is also sent by email. Defaults are digest on, batches off, incidents on.
      required:
      - digest
      - batches
      - incidents
      properties:
        digest:
          type: boolean
        batches:
          type: boolean
        incidents:
          type: boolean
    AvailabilityLandsAt:
      type: object
      description: When something sent now at each tier would reach the member, before muting or space
        caps.
      required:
      - incident
      - now
      - today
      - digest
      properties:
        incident:
          $ref: '#/components/schemas/Timestamp'
        now:
          $ref: '#/components/schemas/Timestamp'
        today:
          $ref: '#/components/schemas/Timestamp'
        digest:
          $ref: '#/components/schemas/Timestamp'
    AvailabilityRelationships:
      type: object
      required:
      - member
      - away_periods
      properties:
        member:
          $ref: '#/components/schemas/ToOneRequired'
        away_periods:
          $ref: '#/components/schemas/ToManyLinkOnly'
    Availability:
      description: 'One resource type with two shapes (ADR 0036): the full view for the member themselves,
        and the limited view, marked by `meta.access: limited`, for everyone else. The limited view leaves
        out exact hours, focus blocks, batches, digest and email settings, and the incidents setting.'
      oneOf:
      - $ref: '#/components/schemas/AvailabilityFull'
      - $ref: '#/components/schemas/AvailabilityLimited'
    AvailabilityFull:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      - links
      properties:
        type:
          type: string
          const: availabilities
        id:
          $ref: '#/components/schemas/AvailabilityId'
        attributes:
          type: object
          required:
          - timezone
          - working_hours
          - focus_blocks
          - response_expectation
          - today_batches
          - digest
          - email
          - incidents_interrupt
          - in_window
          - next_window_starts_at
          - lands_at
          properties:
            timezone:
              $ref: '#/components/schemas/TimeZone'
            working_hours:
              type: array
              description: One to fourteen windows for a human. Empty for an agent, which is always in
                a window.
              maxItems: 14
              items:
                $ref: '#/components/schemas/WorkingWindow'
            focus_blocks:
              type: array
              description: Windows inside working hours when only an incident may interrupt.
              items:
                $ref: '#/components/schemas/WorkingWindow'
            response_expectation:
              oneOf:
              - $ref: '#/components/schemas/Duration'
              - type: 'null'
            today_batches:
              type: array
              description: Up to six local times when `today` items arrive. With none, `today` behaves
                like `now`.
              maxItems: 6
              uniqueItems: true
              items:
                $ref: '#/components/schemas/LocalTime'
            digest:
              description: Null for an agent, which has no digest.
              oneOf:
              - $ref: '#/components/schemas/AvailabilityDigestSchedule'
              - type: 'null'
            email:
              $ref: '#/components/schemas/AvailabilityEmail'
            incidents_interrupt:
              type: boolean
            in_window:
              type: boolean
            next_window_starts_at:
              oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
            lands_at:
              $ref: '#/components/schemas/AvailabilityLandsAt'
        relationships:
          $ref: '#/components/schemas/AvailabilityRelationships'
        links:
          $ref: '#/components/schemas/SelfLinks'
    AvailabilityLimited:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      - links
      - meta
      properties:
        type:
          type: string
          const: availabilities
        id:
          $ref: '#/components/schemas/AvailabilityId'
        attributes:
          type: object
          additionalProperties: false
          required:
          - timezone
          - response_expectation
          - in_window
          - next_window_starts_at
          - lands_at
          properties:
            timezone:
              $ref: '#/components/schemas/TimeZone'
            response_expectation:
              oneOf:
              - $ref: '#/components/schemas/Duration'
              - type: 'null'
            in_window:
              type: boolean
            next_window_starts_at:
              oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
            lands_at:
              $ref: '#/components/schemas/AvailabilityLandsAt'
        relationships:
          $ref: '#/components/schemas/AvailabilityRelationships'
        links:
          $ref: '#/components/schemas/SelfLinks'
        meta:
          type: object
          required:
          - access
          properties:
            access:
              type: string
              const: limited
    AvailabilityDocument:
      type: object
      required:
      - jsonapi
      - data
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          $ref: '#/components/schemas/Availability'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    AvailabilityUpdateDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - id
          - attributes
          properties:
            type:
              type: string
              const: availabilities
            id:
              $ref: '#/components/schemas/AvailabilityId'
            attributes:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                timezone:
                  $ref: '#/components/schemas/TimeZone'
                working_hours:
                  type: array
                  minItems: 1
                  maxItems: 14
                  items:
                    $ref: '#/components/schemas/WorkingWindow'
                focus_blocks:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkingWindow'
                response_expectation:
                  oneOf:
                  - $ref: '#/components/schemas/Duration'
                  - type: 'null'
                today_batches:
                  type: array
