    BriefScope:
      type: string
      enum:
      - member
      - space
      - thread
      - decisions
    BriefAudience:
      type: string
      description: '`reader` for one reader''s brief; `thread` for a roll-up, readable by everyone who
        can see the thread.'
      enum:
      - reader
      - thread
    BriefFocus:
      type: string
      enum:
      - decisions
      - requests_for_me
      - requests_from_me
      - blocked
      - questions_unanswered
      - updates
      - mentions
    BriefLength:
      type: string
      description: '`short` is up to 10 items, `standard` up to 25, `full` up to 100.'
      enum:
      - short
      - standard
      - full
    BriefStatus:
      type: string
      enum:
      - queued
      - generating
      - ready
      - failed
    BriefSince:
      description: A timestamp, or `last_seen` for each thread's read position (ADR 0024). A brief covers
        at most 30 days.
      anyOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: string
        const: last_seen
    BriefSection:
      type: object
      required:
      - kind
      - heading
      properties:
        kind:
          $ref: '#/components/schemas/BriefFocus'
        heading:
          type: string
    BriefModel:
      type: object
      required:
      - provider
      - name
      properties:
        provider:
          type: string
          examples:
          - anthropic
        name:
          type: string
          examples:
          - claude-sonnet-5-5
    BriefFailure:
      type: object
      required:
      - code
      - detail
      properties:
        code:
          type: string
          enum:
          - generator_timeout
          - generator_error
          - validation
        detail:
          type:
          - string
          - 'null'
    BriefSourceWindow:
      type: object
      required:
      - from
      - to
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
    Brief:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      - links
      properties:
        type:
          type: string
          const: briefs
        id:
          $ref: '#/components/schemas/BriefId'
        attributes:
          type: object
          required:
          - status
          - scope
          - since
          - focus
          - length
          - audience
          - sections
          - source_window
          - model
          - failure
          - stale
          - stale_since
          - created_at
          - ready_at
          properties:
            status:
              $ref: '#/components/schemas/BriefStatus'
            scope:
              $ref: '#/components/schemas/BriefScope'
            since:
              oneOf:
              - $ref: '#/components/schemas/BriefSince'
              - type: 'null'
            focus:
              type: array
              items:
                $ref: '#/components/schemas/BriefFocus'
            length:
              $ref: '#/components/schemas/BriefLength'
            audience:
              $ref: '#/components/schemas/BriefAudience'
            sections:
              type: array
              description: Set when the generator submits the brief; empty until then.
              items:
                $ref: '#/components/schemas/BriefSection'
            source_window:
              description: What the brief actually covered.
              oneOf:
              - $ref: '#/components/schemas/BriefSourceWindow'
              - type: 'null'
            model:
              oneOf:
              - $ref: '#/components/schemas/BriefModel'
              - type: 'null'
            failure:
              oneOf:
              - $ref: '#/components/schemas/BriefFailure'
              - type: 'null'
            stale:
              type: boolean
              description: True once something it cites is edited, deleted, superseded or changes state,
                or the reader loses access to it (ADR 0039).
            stale_since:
              oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
            created_at:
              $ref: '#/components/schemas/Timestamp'
            ready_at:
              oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
        relationships:
          type: object
          required:
          - reader
          - requested_by
          - generator
          - space
          - thread
          - items
          properties:
            reader:
              description: The reader; `null` for a roll-up.
              allOf:
              - $ref: '#/components/schemas/ToOne'
            requested_by:
              $ref: '#/components/schemas/ToOneRequired'
            generator:
              $ref: '#/components/schemas/ToOneRequired'
            space:
              $ref: '#/components/schemas/ToOne'
            thread:
              $ref: '#/components/schemas/ToOne'
            items:
              $ref: '#/components/schemas/ToManyLinkOnly'
        links:
          $ref: '#/components/schemas/SelfLinks'
    BriefDocument:
      type: object
      required:
      - jsonapi
      - data
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          $ref: '#/components/schemas/Brief'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    BriefCollectionDocument:
      type: object
      required:
      - jsonapi
      - data
      - links
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Brief'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    BriefCreateDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              const: briefs
            attributes:
              type: object
              required:
              - scope
              properties:
                scope:
                  $ref: '#/components/schemas/BriefScope'
                audience:
                  description: '`thread` makes this a roll-up; only with `scope: thread`. Defaults to
                    `reader`.'
                  allOf:
                  - $ref: '#/components/schemas/BriefAudience'
                since:
                  description: Required for `member` and `space`; optional for `decisions`; not used for
                    `thread`.
                  allOf:
                  - $ref: '#/components/schemas/BriefSince'
                focus:
                  type: array
                  description: Omitting it includes every focus.
                  items:
                    $ref: '#/components/schemas/BriefFocus'
                length:
                  $ref: '#/components/schemas/BriefLength'
            relationships:
              type: object
              properties:
                space:
                  description: 'Required for `scope: space`; optional for `scope: decisions`.'
                  allOf:
                  - $ref: '#/components/schemas/ToOneRequired'
                thread:
                  description: 'Required for `scope: thread`.'
                  allOf:
                  - $ref: '#/components/schemas/ToOneRequired'
    BriefUpdateDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - id
          - attributes
          properties:
            type:
              type: string
              const: briefs
            id:
              $ref: '#/components/schemas/BriefId'
            attributes:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - generating
                  - failed
