          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateRequest
      tags:
      - Requests
      summary: Move a request through its lifecycle, reassign it, or change its dates
      description: 'Every change to a request is a `PATCH` with `If-Match` (RFC 0005,

        ADR 0013), and each is recorded as a request transition. A note

        goes in the document''s top-level `meta.note`, up to 2,000

        characters (ADR 0029).


        | Change | Action | Scope | Who |

        | --- | --- | --- | --- |

        | `state` `pending` to `accepted` | `request.accept` | `requests:write` | Assignee |

        | `state` `pending` to `declined`, `meta.note` required | `request.decline` | `requests:write`
        | Assignee |

        | `state` `pending` or `accepted` to `done` | `request.complete` | `requests:write` | Assignee
        |

        | `assignee` relationship; back to `pending` | `request.assign` | `requests:assign`, or `requests:write`
        to take it on or hand it back to the requester | Assignee, requester, admin |

        | `state` `pending` or `accepted` to `cancelled` (final) | `request.cancel` | `requests:write`
        | Requester, admin |

        | `state` `declined` or `done` to `pending` | `request.reopen` | `requests:write` | Requester
        |

        | `due_by`, `done_when` | `request.update` | `requests:write` | Requester; refused once `done`,
        `declined` or `cancelled` |

        | `proposed_due_by` | `request.propose_due_by` | `requests:write` | Assignee proposes or withdraws
        (`null`); requester declines (`null`) |


        The requester accepts a proposed date by setting `due_by` to it,

        which clears the proposal. When the requester is also the

        assignee, they change `due_by` directly. A transition from the

        wrong state is `409` `invalid-transition` with

        `meta.current_state` and `meta.allowed`. A missing scope is `403`

        `insufficient-scope` with `meta.action`. The new assignee must be

        able to see the thread, and `due_by` must be in the future, or

        `422` `validation-failed`.

        '
      x-longhand-action: request.accept, request.decline, request.complete, request.assign, request.cancel,
        request.reopen, request.update, request.propose_due_by
      security:
      - oauth2:
        - requests:write
      - oauth2:
        - requests:assign
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RequestUpdateDocument'
            examples:
              accept:
                summary: Accept
                value:
                  data:
                    type: requests
                    id: req_01JAA4QZ8W3N5Y7K2M4P6R8T0V
                    attributes:
                      state: accepted
              decline:
                summary: Decline, with the required note
                value:
                  data:
                    type: requests
                    id: req_01JAA4QZ8W3N5Y7K2M4P6R8T0V
                    attributes:
                      state: declined
                  meta:
                    note: Out until Monday, Priya knows this area better
              complete:
                summary: Complete, with an optional note
                value:
                  data:
                    type: requests
                    id: req_01JAA4QZ8W3N5Y7K2M4P6R8T0V
                    attributes:
                      state: done
                  meta:
                    note: Reviewed and left comments on the spec
              reassign:
                summary: Reassign to another member
                value:
                  data:
                    type: requests
                    id: req_01JAA4QZ8W3N5Y7K2M4P6R8T0V
                    relationships:
                      assignee:
                        data:
                          type: members
                          id: mem_01JA7T2B4D6F8H0J2K4M6N8P0Q
                  meta:
                    note: Priya owns the retry logic
              cancel:
                summary: Cancel
                value:
                  data:
                    type: requests
                    id: req_01JAA4QZ8W3N5Y7K2M4P6R8T0V
                    attributes:
                      state: cancelled
                  meta:
                    note: Covered in the design review instead
              reopen:
                summary: Reopen a declined or done request
                value:
                  data:
                    type: requests
                    id: req_01JAA4QZ8W3N5Y7K2M4P6R8T0V
                    attributes:
                      state: pending
                  meta:
                    note: The retry spec changed, could you look again?
              proposeDueBy:
                summary: Assignee proposes a new due date
                value:
                  data:
                    type: requests
                    id: req_01JAA4QZ8W3N5Y7K2M4P6R8T0V
                    attributes:
                      proposed_due_by: '2026-10-13T12:00:00Z'
                  meta:
                    note: I can do Monday, not Friday
              acceptProposal:
                summary: Requester accepts the proposed date
                value:
                  data:
                    type: requests
                    id: req_01JAA4QZ8W3N5Y7K2M4P6R8T0V
                    attributes:
                      due_by: '2026-10-13T12:00:00Z'
              updateDates:
                summary: Requester changes the due date and what done means
