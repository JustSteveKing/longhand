                summary: A catch-up since the reader last looked
                value:
                  data:
                    type: briefs
                    attributes:
                      scope: member
                      since: last_seen
                      focus:
                      - decisions
                      - requests_for_me
                      - blocked
                      length: short
              rollUp:
                summary: Roll up a thread for everyone who can see it
                value:
                  data:
                    type: briefs
                    attributes:
                      scope: thread
                      audience: thread
                      length: standard
                    relationships:
                      thread:
                        data:
                          type: threads
                          id: thr_01JA9X0000000000000000000A
