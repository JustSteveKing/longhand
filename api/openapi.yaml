      summary: Create several resources together, all or nothing
      description: 'The JSON:API Atomic Operations extension (ADR 0022), negotiated with

        `ext="https://jsonapi.org/ext/atomic"` on `Content-Type` and

        `Accept`. Operations run in order and apply all or none; later

        operations refer to earlier ones by `lid`. The response is `200 OK`

        with one result per operation, in the same order; a created post''s

        result `meta` carries its `delivery` summary.


        **Only documented compositions are accepted**; any other combination

        is `400` `unsupported-operations`:


        1. A thread and its first post (RFC 0004).

        2. A thread, its first post with the `request` intent, and the request (RFC 0005). A `request`
        thread must start this way.

        3. A post with the `request` intent and its request (RFC 0005).

        4. A post with the `decision` intent and its decision (RFC 0005).

        5. Resolving a decision thread in one step: the decision post, its decision, then an `update`
        of the thread to `resolved` with its `outcome` (RFC 0005).

        6. Superseding a decision: a decision post and a decision whose `supersedes` names the active
        decision it replaces (RFC 0005).

        7. Up to 100 `update` operations on the caller''s inbox items, each changing `state` (RFC 0006).

        8. A generator submitting a brief: an `update` of the brief setting `sections`, `model` and `status:
        "ready"`, then an `add` for each item (RFC 0007). A submission that breaks the citation rules
        is `422` `uncited-content`, one error per item.


        Each operation runs through the same Action, permission check and

        approval rules as it would alone. One `Idempotency-Key` covers the

        whole request; an `If-Match` header is ignored. Every `update` or

        `remove` of a mutable resource carries the ETag it expects in its

        own `meta.if_match` (ADR 0035): missing is `428`

        `precondition-required`, stale is `412` `precondition-failed`. An

        error in any operation undoes them all, and its `source.pointer`

        names the operation, such as

        `/atomic:operations/1/data/attributes/body/text`.

        '
