      description: RFC 0010. Action `subscription.rotate_secret`. Issues a new Standard Webhooks secret,
        returned once in `meta.secret`. For 24 hours deliveries are signed with both the old and the new
        secret.
      x-longhand-action: subscription.rotate_secret
      security:
      - oauth2:
        - webhooks:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The subscription, with the new secret in `meta.secret`.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SubscriptionCreatedDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /subscriptions/{subscription}/deliveries:
    parameters:
    - $ref: '#/components/parameters/SubscriptionPath'
    get:
      operationId: listSubscriptionDeliveries
      tags:
      - Events
      summary: A subscription's recent deliveries
      description: RFC 0010. Each attempt to send an event to the subscription, newest first.
      security:
      - oauth2:
        - webhooks:write
      parameters:
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageAfter'
      - $ref: '#/components/parameters/PageBefore'
      responses:
        '200':
          description: The deliveries.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryCollectionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /webhook-deliveries:
    post:
      operationId: createWebhookDelivery
      tags:
      - Events
      summary: Replay an event, or send a test
      description: 'RFC 0010. With a subscription and an event, action `webhook_delivery.replay` sends
        that event again as a new delivery. With `test: true` and no event, action `webhook_delivery.test`
        sends a `subscription.test` event with a sample payload. By the subscription''s creator, an owner
        or an admin. Replaying to a disabled subscription is `409` `invalid-transition`.'
      x-longhand-action: webhook_delivery.replay
      security:
      - oauth2:
        - webhooks:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WebhookDeliveryCreateDocument'
            examples:
              replay:
                summary: Replay one event
                value:
                  data:
                    type: webhook_deliveries
                    attributes:
                      test: false
                    relationships:
                      subscription:
                        data:
                          type: subscriptions
                          id: sub_01JAF00000000000000000000A
                      event:
                        data:
                          type: events
                          id: evt_01JAC30000000000000000000A
              test:
                summary: Send a test event
                value:
                  data:
                    type: webhook_deliveries
                    attributes:
                      test: true
                    relationships:
                      subscription:
                        data:
                          type: subscriptions
                          id: sub_01JAF00000000000000000000A
      responses:
        '201':
          description: The new delivery.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /webhook-deliveries/{delivery}:
    parameters:
    - $ref: '#/components/parameters/WebhookDeliveryPath'
    get:
      operationId: getWebhookDelivery
      tags:
      - Events
      summary: Read one delivery
      description: RFC 0010.
      security:
      - oauth2:
        - webhooks:write
      responses:
        '200':
          description: The delivery.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /events:
    get:
      operationId: listEvents
      tags:
      - Events
      summary: Events still within retention
      description: 'RFC 0010, ADR 0050, ADR 0051. The recovery path for missed webhooks and offline clients:
        the caller''s view of events, oldest first, evaluated at the time of the request. Each resource''s
        `attributes.cloudevent` holds the CloudEvent exactly as it would have been delivered. Events are
        kept for as long as the retention RFC sets, 30 days until it does. Reading an event needs the
        scope for its resource family, so the events returned depend on the token''s scopes.'
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageAfter'
      - $ref: '#/components/parameters/PageBefore'
      - name: filter[after]
        in: query
        description: An event ID; returns events after it. This is how a consumer resumes from the last
          event it processed.
        schema:
          $ref: '#/components/schemas/EventId'
      - name: filter[type]
        in: query
        description: Comma-separated event types without the `longhand.` prefix, each exact or with a
          trailing `*` per resource.
        schema:
          type: string
          examples:
          - request.*,thread.stale
      - name: filter[space]
        in: query
        description: Comma-separated space IDs.
        schema:
          type: string
      - name: filter[subject]
        in: query
        description: Comma-separated resource IDs the events are about.
        schema:
          type: string
      - name: filter[actorkind]
        in: query
        description: Comma-separated actor kinds.
        schema:
          type: string
          examples:
          - human
      responses:
        '200':
          description: The events.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EventCollectionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /stream-tickets:
    post:
      operationId: createStreamTicket
      tags:
      - Events
      summary: Create a stream ticket
      description: RFC 0010, ADR 0053. Action `stream.ticket`, for any member with any valid token, needing
        no particular scope. The ticket's `token` is a hub subscriber token listing exactly the topics
        the caller's role, scopes and allow-list permit, and `stream_url` carries it as the `ticket` query
        parameter. A ticket only opens the stream, must be used within 60 seconds, and is recorded in
        the audit log. An open connection is not cut when the 60 seconds pass.
      x-longhand-action: stream.ticket
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/StreamTicketCreateDocument'
            examples:
              ticket:
                value:
                  data:
                    type: stream_tickets
      responses:
        '201':
          description: The ticket.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StreamTicketDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /stream:
    get:
      operationId: openStream
      tags:
      - Events
      summary: The real-time event stream
      description: "RFC 0010, ADR 0053, ADR 0054. A Server-Sent Events stream of the\ncaller's events,\
        \ and the only real-time transport in v1. It is not\nJSON:API: it is served by a Mercure hub (FrankenPHP's,\
        \ in\nproduction), routed under `/v1/stream` at the proxy.\n\nEach message carries one CloudEvent:\n\
        \n- `event` is the CloudEvent `type`, so browsers can\n  `addEventListener` per type;\n- `data`\
        \ is the CloudEvent, rendered for the caller;\n- `id` is the hub's cursor, opaque and not the\
        \ CloudEvent `id`.\n  Clients deduplicate on the `id` inside `data`.\n\nThe hub sends heartbeats\
        \ and a `retry:` field, and closes every\nconnection after 10 minutes. A client reconnects with\
        \ the last SSE\n`id` it received, as `Last-Event-ID` or `last_event_id`, and the hub\nreplays\
        \ from its history, kept for at least an hour. If the\nresponse's `Last-Event-ID` differs from\
        \ what was sent, events were\nlost, and the client catches up through `GET /events` with\n`filter[after]`.\n\
        \nOn `stream.revoked`, every client must close the connection and\nreconnect with a new credential.\
        \ A client raises a notification\nonly for `inbox.item_delivered`.\n\nCredentials: a stream ticket's\
        \ token as `Authorization: Bearer`\n(server-side consumers and agents) or in `ticket` (third-party\n\
        browser clients), or the first-party web app's `mercureAuthorization`\ncookie.\n"
      security:
      - streamTicketBearer: []
      - streamTicketQuery: []
      - hubCookie: []
      parameters:
      - name: ticket
        in: query
        description: A stream ticket's token, for browser clients that cannot set headers.
        schema:
          type: string
      - name: last_event_id
        in: query
        description: The last SSE `id` received, when opening a fresh connection.
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        description: The last SSE `id` received, sent automatically by `EventSource` on reconnect.
        schema:
          type: string
      - name: spaces
        in: query
        description: Comma-separated space IDs. Narrows the topics subscribed to, never widens them.
        schema:
          type: string
      - name: types
        in: query
        description: Comma-separated event types, exact or with a trailing `*`. Narrows, never widens.
        schema:
          type: string
      responses:
        '200':
          description: The stream.
          headers:
            Last-Event-ID:
              description: The cursor the hub actually resumed from.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE messages, each with `id`, `event` and a `data` line holding one CloudEvent.
              examples:
                message:
                  value: 'id: urn:uuid:7c0e5a52-3a4f-4a4e-9a3b-0f6d0c1a2b3c

                    event: longhand.post.created

                    data: {"specversion":"1.0","type":"longhand.post.created","id":"evt_01JAC30000000000000000000A"}

                    '
        '401':
          description: The ticket or cookie is missing or has expired. Get a new one and reconnect with
            `last_event_id`.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'OAuth 2.1 from Longhand''s authorisation server (ADR 0060). People''s

        apps use the authorisation code flow with PKCE and choose a

        workspace at consent; agents use client credentials issued when

        the agent is created. A token belongs to one member, so to one

        workspace. What a token may do is the intersection of its scopes,

        the member''s role (or an agent''s owner''s role), and what the member

        can see (RFC 0003).

        '
      flows:
        authorizationCode:
          authorizationUrl: https://longhand.example/oauth/authorize
          tokenUrl: https://longhand.example/oauth/token
          refreshUrl: https://longhand.example/oauth/token
          scopes: &id009
            workspace:read: Read the workspace's name, handle and settings
            workspace:write: Change the workspace's settings. Owners and admins, humans only
            members:read: Read members and their limited availability
            members:write: Invite, change roles, deactivate members, manage agents. Humans only
            spaces:read: List and read visible spaces and their memberships
            spaces:write: Create, update and archive spaces, and manage memberships
            threads:read: Read threads and everything in them
            threads:write: Create threads and change their status, owner and deadlines
            posts:write:draft: Create posts as drafts only
            posts:write: Create, edit and publish posts
            requests:write: Create requests and move them through their lifecycle
            requests:assign: Assign or reassign a request to someone other than the caller
            decisions:write: Draft decisions, and for humans publish and supersede them
            inbox:read: Read the member's own inbox, or their principal's when delegated
            inbox:write: Act on the member's own inbox, or their principal's when delegated
            briefs:read: Read briefs the member is the reader of, and roll-ups they can see
            briefs:write: Request briefs and roll-ups, and write them as a generator
            check_ins:read: Read check-ins, runs and responses
            check_ins:write: Create check-ins and submit responses
            availability:write: Change the member's own availability and away periods
            webhooks:write: Manage webhook subscriptions. Humans only
            audit:read: Read the audit log. Owners and admins only
        clientCredentials:
          tokenUrl: https://longhand.example/oauth/token
          scopes: *id009
    streamTicketBearer:
      type: http
      scheme: bearer
      description: A stream ticket's `token`, from `POST /stream-tickets`. Opens the stream only, within
        60 seconds of issue.
    streamTicketQuery:
      type: apiKey
      in: query
      name: ticket
      description: A stream ticket's `token` in the URL, for browser clients. Short-lived because URLs
        reach logs.
    hubCookie:
      type: apiKey
      in: cookie
      name: mercureAuthorization
      description: The first-party web app's hub cookie, `HttpOnly`, `Secure`, `SameSite=Strict`, scoped
        to the stream path, lasting at most 10 minutes.
  parameters:
    Include:
      name: include
      in: query
      description: Comma-separated relationship paths to include (JSON:API). Each operation lists what
        it supports; anything else is `400` `invalid-query-parameter`. Includes never widen visibility.
      schema:
        type: string
      style: form
      explode: false
    PageSize:
      name: page[size]
      in: query
      description: Page size. Over the maximum is `400` with the profile's `max-size-exceeded` error.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageAfter:
      name: page[after]
      in: query
      description: An opaque cursor from a previous page's `links.next`. Bound to the query that produced
        it.
      schema:
        type: string
    PageBefore:
      name: page[before]
      in: query
      description: An opaque cursor from a previous page's `links.prev`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Kept for 24 hours, scoped to the member, method and path. A replay with the same body
        returns the original response with `Idempotent-Replayed: true`; a different body, or a request
        still in flight, is `409` `idempotency-key-conflict`.'
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` last seen for the resource. Missing is `428` `precondition-required`; stale
        is `412` `precondition-failed`.
      schema:
        type: string
    RequestIdHeader:
      name: X-Request-Id
      in: header
      description: Optional client request ID, up to 128 characters, echoed back. Generated when absent.
      schema:
        type: string
        maxLength: 128
    ThreadFilterStatus:
      name: filter[status]
      in: query
      description: One or more of `draft`, `open`, `waiting`, `resolved`, `archived`, comma separated.
      schema:
        type: string
    ThreadFilterPurpose:
      name: filter[purpose]
      in: query
      description: One or more of `discussion`, `decision`, `request`, `announcement`, `incident`.
      schema:
        type: string
    ThreadFilterOwner:
      name: filter[owner]
      in: query
      description: One or more member IDs, or `me`.
      schema:
        type: string
    ThreadFilterParticipant:
      name: filter[participant]
      in: query
      description: One or more member IDs, or `me`.
      schema:
        type: string
    ThreadSort:
      name: sort
      in: query
      description: Defaults to `-last_activity_at`, newest first.
      schema:
        type: string
        enum:
        - last_activity_at
        - -last_activity_at
        - created_at
        - -created_at
        default: -last_activity_at
    ThreadInclude:
      name: include
      in: query
      description: 'Allowed: `owner`, `participants`, `space`, `decision`.'
      schema:
        type: string
    AttentionMemberPath:
      name: member
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MemberId'
    AvailabilityPath:
      name: availability
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AvailabilityId'
    AwayPeriodPath:
      name: away_period
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AwayPeriodId'
    InboxItemPath:
      name: item
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/InboxItemId'
    DigestPath:
      name: digest
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DigestId'
    BriefIdPath:
      name: brief
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BriefId'
    BriefFeedbackIdPath:
      name: feedback
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BriefFeedbackId'
    CheckInIdPath:
      name: check_in
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CheckInId'
    CheckInRunIdPath:
      name: run
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CheckInRunId'
    CheckInResponseIdPath:
      name: response
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CheckInResponseId'
    SubscriptionPath:
      name: subscription
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SubscriptionId'
    WebhookDeliveryPath:
      name: delivery
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WebhookDeliveryId'
  headers:
    ETag:
      description: The resource's current version, for `If-Match`.
      schema:
        type: string
    Location:
      description: The URL of the created or queued resource.
      schema:
        type: string
        format: uri
    RequestId:
      description: The request's ID, also in `meta.request_id`.
      schema:
        type: string
    RateLimit:
      description: IETF RateLimit header for the token's current window.
      schema:
        type: string
    RateLimitPolicy:
      description: IETF RateLimit-Policy header.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    IdempotentReplayed:
      description: Present and `true` when the response is a replay of an earlier request with the same
        `Idempotency-Key`.
      schema:
        type: boolean
    WwwAuthenticate:
      description: RFC 6750 challenge naming the missing `scope` on `insufficient-scope`.
      schema:
        type: string
  responses:
    NoContent:
      description: Done; no document.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    BadRequest:
      description: '`malformed-request-body`, `invalid-query-parameter`, `invalid-pagination-cursor`,
        the pagination profile''s `max-size-exceeded`, or `unsupported-operations`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Unauthorized:
      description: '`unauthorized` or `expired-authentication-token`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Forbidden:
      description: The caller can see the resource but may not do this. `insufficient-scope` (with `meta.action`
        and `WWW-Authenticate`), or a product error such as `approval-required`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotFound:
      description: '`resource-not-found`: it does not exist, or the caller cannot see it (ADR 0012).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    MethodNotAllowed:
      description: '`method-not-allowed`, with `Allow`.'
      headers:
        Allow:
          schema:
            type: string
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotAcceptable:
      description: '`not-acceptable`: `Accept` disqualifies every JSON:API media type.'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Conflict:
      description: '`resource-conflict`, `idempotency-key-conflict` (with `Retry-After` while in flight),
        `invalid-transition`, or another product conflict named by the operation.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    PreconditionFailed:
      description: '`precondition-failed`: `If-Match` did not match. The response carries the current
        `ETag`.'
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    PayloadTooLarge:
      description: '`payload-too-large`: the request document is over 1 MiB, or a declared upload is over
        100 MiB.'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UnsupportedMediaType:
      description: '`unsupported-media-type`: not `application/vnd.api+json`, or an unsupported extension
        or media type parameter.'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UnprocessableEntity:
      description: '`validation-failed`, one error per invalid field with `source.pointer`, or a product
        error named by the operation.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    PreconditionRequired:
      description: '`precondition-required`: `If-Match` is missing.'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    TooManyRequests:
      description: '`rate-limit-exceeded`, with `Retry-After`; `detail` names the limit.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    ServerError:
      description: '`internal-server-error`.'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
  schemas:
    JsonApiVersion:
      type: object
      required:
      - version
      properties:
        version:
          type: string
          const: '1.1'
        ext:
          type: array
          items:
            type: string
            format: uri
        profile:
          type: array
          items:
            type: string
            format: uri
    DocumentMeta:
      type: object
      description: Top-level `meta`. Always carries `request_id`.
      required:
      - request_id
      properties:
        request_id:
          type: string
      additionalProperties: true
    SelfLinks:
      type: object
      required:
      - self
      properties:
        self:
          type: string
          format: uri
    RelatedLinks:
      type: object
      required:
      - related
      properties:
        related:
          type: string
          format: uri-reference
    PaginationLinks:
      type: object
      description: Cursor pagination profile links; `null` at either end.
      required:
      - next
      - prev
      properties:
        self:
          type: string
          format: uri-reference
        next:
          type:
          - string
          - 'null'
          format: uri-reference
        prev:
          type:
          - string
          - 'null'
          format: uri-reference
    ResourceIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
        meta:
          type: object
          additionalProperties: true
    ToOne:
      type: object
      required:
      - data
      properties:
        data:
          oneOf:
          - $ref: '#/components/schemas/ResourceIdentifier'
          - type: 'null'
    ToOneRequired:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ResourceIdentifier'
    ToMany:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceIdentifier'
    ToManyLinkOnly:
      type: object
      description: A to-many relationship too large to embed, carrying only `links.related` (RFC 0002).
      required:
      - links
      properties:
        links:
          $ref: '#/components/schemas/RelatedLinks'
    ResourceObject:
      type: object
      description: Any resource object; each type narrows it.
      required:
      - type
      - id
      - attributes
      - links
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          type: object
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
        links:
          $ref: '#/components/schemas/SelfLinks'
        meta:
          type: object
          additionalProperties: true
    AccessMeta:
      type: object
      description: Set on a resource the caller sees in a limited view (ADR 0025, ADR 0036).
      properties:
        access:
          type: string
          enum:
          - limited
    ErrorDocument:
      type: object
      required:
      - jsonapi
      - errors
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorObject'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    ErrorObject:
      type: object
      required:
      - status
      - code
      - title
      - detail
      - links
      properties:
        status:
          type: string
          description: The HTTP status, as a string.
        code:
          $ref: '#/components/schemas/ErrorCode'
        title:
          type: string
          description: A short, fixed summary of the error type.
        detail:
          type: string
          description: What went wrong with this request, in a sentence a person can act on.
        links:
          type: object
          required:
          - type
          properties:
            type:
              type: string
              format: uri
              description: A permanent URL for the error type, resolving to its documentation.
        source:
          type: object
          properties:
            pointer:
              type: string
              description: A JSON Pointer into the request document.
            parameter:
              type: string
              description: The query parameter at fault.
            header:
              type: string
              description: The request header at fault.
        meta:
          type: object
          description: Whatever the client needs to recover, per error type. `action` names the attempted
            action on `insufficient-scope` and `approval-required`.
          additionalProperties: true
    ErrorCode:
      type: string
      description: 'Generic codes are apiguide.dev''s (`links.type` is

        `https://apiguide.dev/errors/{code}`); product codes are Longhand''s

        own (`https://api.longhand.example/problems/{code}`). The

        pagination profile''s error uses the profile''s own type URL.

        '
      enum:
      - malformed-request-body
      - invalid-pagination-cursor
      - invalid-query-parameter
      - unauthorized
      - expired-authentication-token
      - insufficient-scope
      - resource-not-found
      - method-not-allowed
      - not-acceptable
      - idempotency-key-conflict
      - resource-conflict
      - precondition-failed
      - payload-too-large
      - unsupported-media-type
      - validation-failed
      - precondition-required
      - rate-limit-exceeded
      - internal-server-error
      - service-unavailable
      - max-size-exceeded
      - approval-required
      - invalid-transition
      - uncited-content
      - decision-immutable
      - incident-only
      - last-owner
      - scope-exceeds-owner
      - agent-limit-reached
      - thread-not-open
      - unsupported-operations
      - not-a-respondent
    AtomicOperation:
      type: object
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - add
          - update
          - remove
        ref:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
            lid:
              type: string
            relationship:
              type: string
        href:
          type: string
          format: uri-reference
        data: {}
        meta:
          type: object
          properties:
            if_match:
              type: string
              description: Required on `update` and `remove` of a mutable resource (ADR 0035).
          additionalProperties: true
    AtomicRequestDocument:
      type: object
      required:
      - atomic:operations
      properties:
        atomic:operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AtomicOperation'
    AtomicResult:
      type: object
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
    AtomicResponseDocument:
      type: object
      required:
      - jsonapi
      - atomic:results
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        atomic:results:
          type: array
          items:
            $ref: '#/components/schemas/AtomicResult'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, always in UTC with `Z`.
    LocalDate:
      type: string
      format: date
    LocalTime:
      type: string
      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      description: A local wall-clock time, `HH:MM`.
    Weekday:
      type: string
      enum:
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
      - sun
    Duration:
      type: string
      description: An ISO 8601 duration, such as `P7D` or `PT12H`.
      pattern: ^P(?!$)(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(?=\d)(\d+H)?(\d+M)?(\d+S)?)?$
    TimeZone:
      type: string
      description: An IANA timezone name.
      examples:
      - Europe/London
    Urgency:
      type: string
      enum:
      - incident
      - now
      - today
      - digest
    Intent:
      type: string
      enum:
      - fyi
      - question
      - request
      - update
      - decision
    MemberKind:
      type: string
      enum:
      - human
      - agent
    Surface:
      type: string
      enum:
      - rest
      - mcp
      - web
      - system
    Scope:
      type: string
      enum:
      - workspace:read
      - workspace:write
      - members:read
      - members:write
      - spaces:read
      - spaces:write
      - threads:read
      - threads:write
      - posts:write:draft
      - posts:write
      - requests:write
      - requests:assign
      - decisions:write
      - inbox:read
      - inbox:write
      - briefs:read
      - briefs:write
      - check_ins:read
      - check_ins:write
      - availability:write
      - webhooks:write
      - audit:read
    Markdown:
      type: object
      required:
      - format
      - text
      properties:
        format:
          type: string
          const: markdown
        text:
          type: string
          maxLength: 40000
    ActionName:
      type: string
      description: A named action, `resource.verb` (ADR 0017), such as `thread.resolve`.
      pattern: ^[a-z_]+\.[a-z_]+$
    WorkspaceId:
      type: string
      pattern: ^wsp_[0-9A-HJKMNP-TV-Z]{26}$
    MemberId:
      type: string
      pattern: ^mem_[0-9A-HJKMNP-TV-Z]{26}$
    SpaceId:
      type: string
      pattern: ^spc_[0-9A-HJKMNP-TV-Z]{26}$
    SpaceMembershipId:
      type: string
      pattern: ^smb_[0-9A-HJKMNP-TV-Z]{26}$
    ThreadId:
      type: string
      pattern: ^thr_[0-9A-HJKMNP-TV-Z]{26}$
    PostId:
      type: string
      pattern: ^pst_[0-9A-HJKMNP-TV-Z]{26}$
    PostRevisionId:
      type: string
      pattern: ^rev_[0-9A-HJKMNP-TV-Z]{26}$
    ReactionId:
      type: string
      pattern: ^rxn_[0-9A-HJKMNP-TV-Z]{26}$
    UploadId:
      type: string
      pattern: ^upl_[0-9A-HJKMNP-TV-Z]{26}$
    RequestId:
      type: string
      pattern: ^req_[0-9A-HJKMNP-TV-Z]{26}$
    RequestTransitionId:
      type: string
      pattern: ^rtr_[0-9A-HJKMNP-TV-Z]{26}$
    DecisionId:
      type: string
      pattern: ^dec_[0-9A-HJKMNP-TV-Z]{26}$
    InboxItemId:
      type: string
      pattern: ^inb_[0-9A-HJKMNP-TV-Z]{26}$
    AvailabilityId:
      type: string
      pattern: ^avl_[0-9A-HJKMNP-TV-Z]{26}$
    AwayPeriodId:
      type: string
      pattern: ^awy_[0-9A-HJKMNP-TV-Z]{26}$
    DigestId:
      type: string
      pattern: ^dig_[0-9A-HJKMNP-TV-Z]{26}$
    BriefId:
      type: string
      pattern: ^brf_[0-9A-HJKMNP-TV-Z]{26}$
    BriefItemId:
      type: string
      pattern: ^bit_[0-9A-HJKMNP-TV-Z]{26}$
    BriefFeedbackId:
      type: string
      pattern: ^bfb_[0-9A-HJKMNP-TV-Z]{26}$
    CheckInId:
      type: string
      pattern: ^chk_[0-9A-HJKMNP-TV-Z]{26}$
    CheckInRunId:
      type: string
      pattern: ^run_[0-9A-HJKMNP-TV-Z]{26}$
    CheckInResponseId:
      type: string
      pattern: ^rsp_[0-9A-HJKMNP-TV-Z]{26}$
    InvitationId:
      type: string
      pattern: ^inv_[0-9A-HJKMNP-TV-Z]{26}$
    AuditEventId:
      type: string
      pattern: ^aud_[0-9A-HJKMNP-TV-Z]{26}$
    SubscriptionId:
      type: string
      pattern: ^sub_[0-9A-HJKMNP-TV-Z]{26}$
    WebhookDeliveryId:
      type: string
      pattern: ^dlv_[0-9A-HJKMNP-TV-Z]{26}$
    EventId:
      type: string
      pattern: ^evt_[0-9A-HJKMNP-TV-Z]{26}$
    StreamTicketId:
      type: string
      pattern: ^stk_[0-9A-HJKMNP-TV-Z]{26}$
    MemberRole:
      type: string
      enum:
      - owner
      - admin
      - member
      - guest
    MemberStatus:
      type: string
      description: '`suspended` applies to agents only.'
      enum:
      - active
      - deactivated
      - suspended
    MemberAvailabilitySummary:
      type: object
      description: The public summary of a member's availability (RFC 0006). Agents are always in a window.
      required:
      - in_window
      - next_window_starts_at
      properties:
        in_window:
          type: boolean
        next_window_starts_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
    AgentModel:
      type: object
      required:
      - provider
      - name
      properties:
        provider:
          type: string
        name:
          type: string
    MemberHandle:
      type: string
      pattern: ^[a-z0-9-]{2,32}$
      description: Unique in the workspace. Lowercase letters, digits and hyphens, 2 to 32 characters.
    Member:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      - links
      properties:
        type:
          type: string
          const: members
        id:
          $ref: '#/components/schemas/MemberId'
        attributes:
          type: object
          description: Attributes only agents have are `null` on humans; `role` is `null` on agents.
          required:
          - kind
          - display_name
          - handle
          - role
          - status
          - timezone
          - availability
          - description
          - scopes
          - requires_approval_for
          - model
          - assistant
          - spaces_follow_principal
          - created_at
          properties:
            kind:
              $ref: '#/components/schemas/MemberKind'
            display_name:
              type: string
            handle:
              $ref: '#/components/schemas/MemberHandle'
            role:
              oneOf:
              - $ref: '#/components/schemas/MemberRole'
              - type: 'null'
            status:
              $ref: '#/components/schemas/MemberStatus'
            timezone:
              description: A read-only copy of the member's availability timezone (RFC 0006).
              $ref: '#/components/schemas/TimeZone'
            availability:
              $ref: '#/components/schemas/MemberAvailabilitySummary'
            description:
              type:
              - string
              - 'null'
            scopes:
              oneOf:
              - type: array
                items:
                  $ref: '#/components/schemas/Scope'
              - type: 'null'
            requires_approval_for:
              description: Action names an agent must have approved (ADR 0018).
              oneOf:
              - type: array
                items:
                  $ref: '#/components/schemas/ActionName'
              - type: 'null'
            model:
              oneOf:
              - $ref: '#/components/schemas/AgentModel'
              - type: 'null'
            assistant:
              description: '`true` for a person''s MCP assistant (RFC 0011), `false` for other agents,
                `null` for humans.'
              type:
              - boolean
              - 'null'
            spaces_follow_principal:
              description: For an assistant, whether its spaces follow the person's (RFC 0011). `null`
                for other members.
              type:
              - boolean
              - 'null'
            created_at:
              $ref: '#/components/schemas/Timestamp'
        relationships:
          type: object
          description: Present on agents only.
          properties:
            owner:
              $ref: '#/components/schemas/ToOne'
            spaces:
              $ref: '#/components/schemas/ToMany'
            acts_on_behalf_of:
              $ref: '#/components/schemas/ToOne'
        links:
          $ref: '#/components/schemas/SelfLinks'
        meta:
          type: object
          additionalProperties: true
    MemberDocument:
      type: object
      required:
      - jsonapi
      - data
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          $ref: '#/components/schemas/Member'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    MemberCollectionDocument:
      type: object
      required:
      - jsonapi
      - data
      - links
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    AgentClientCredentials:
      type: object
      description: OAuth client credentials for an agent. The secret is shown once and never again.
      required:
      - client_id
      - client_secret
      properties:
        client_id:
          type: string
        client_secret:
          type: string
    AgentCredentialsDocument:
      type: object
      required:
      - jsonapi
      - data
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          $ref: '#/components/schemas/Member'
        meta:
          allOf:
          - $ref: '#/components/schemas/DocumentMeta'
          - type: object
            required:
            - client_credentials
            properties:
              client_credentials:
                $ref: '#/components/schemas/AgentClientCredentials'
    AgentCreateDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          - relationships
          properties:
            type:
              type: string
              const: members
            attributes:
              type: object
              required:
              - kind
              - display_name
              - handle
              - scopes
              properties:
                kind:
                  type: string
                  const: agent
                display_name:
                  type: string
                handle:
                  $ref: '#/components/schemas/MemberHandle'
                description:
                  type:
                  - string
                  - 'null'
                scopes:
                  type: array
                  items:
                    $ref: '#/components/schemas/Scope'
                requires_approval_for:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActionName'
                model:
                  $ref: '#/components/schemas/AgentModel'
            relationships:
              type: object
              required:
              - owner
              - spaces
              properties:
                owner:
                  $ref: '#/components/schemas/ToOneRequired'
                spaces:
                  $ref: '#/components/schemas/ToMany'
                acts_on_behalf_of:
                  $ref: '#/components/schemas/ToOne'
    MemberUpdateDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - id
          properties:
            type:
              type: string
              const: members
            id:
              $ref: '#/components/schemas/MemberId'
            attributes:
              type: object
              properties:
                display_name:
                  type: string
                handle:
                  $ref: '#/components/schemas/MemberHandle'
                role:
                  $ref: '#/components/schemas/MemberRole'
                status:
                  $ref: '#/components/schemas/MemberStatus'
                description:
                  type:
                  - string
                  - 'null'
                scopes:
                  type: array
                  items:
                    $ref: '#/components/schemas/Scope'
                requires_approval_for:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActionName'
                model:
                  $ref: '#/components/schemas/AgentModel'
                spaces_follow_principal:
                  type: boolean
            relationships:
              type: object
              properties:
                owner:
                  $ref: '#/components/schemas/ToOneRequired'
                spaces:
                  $ref: '#/components/schemas/ToMany'
                acts_on_behalf_of:
                  $ref: '#/components/schemas/ToOne'
    Workspace:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      - links
      properties:
        type:
          type: string
          const: workspaces
        id:
          $ref: '#/components/schemas/WorkspaceId'
        attributes:
          type: object
          required:
          - name
          - handle
          - default_timezone
          - max_agents_per_member
          - max_assistants_per_member
          - brief_daily_limit
          - semantic_search
          - subscription_approval
          - created_at
          properties:
            name:
              type: string
            handle:
              type: string
            default_timezone:
              description: The default for new spaces and check-ins.
              $ref: '#/components/schemas/TimeZone'
            max_agents_per_member:
              type: integer
              minimum: 0
              description: How many agents one member may own (RFC 0003). 5 by default.
            max_assistants_per_member:
              type: integer
              minimum: 0
              description: How many MCP assistants one member may have, apart from the agent cap (RFC
                0011). 5 by default.
            brief_daily_limit:
              type: integer
              minimum: 1
              maximum: 500
              description: Briefs and roll-ups each member may request a day (RFC 0007). 30 by default.
            semantic_search:
              type: boolean
              description: Whether content is embedded for semantic and hybrid search (RFC 0009). On by
                default.
            subscription_approval:
              type: boolean
              description: Whether members' webhook subscriptions wait for an owner or admin (RFC 0010).
                On by default.
            created_at:
              $ref: '#/components/schemas/Timestamp'
        relationships:
          type: object
          required:
          - brief_generator
          properties:
            brief_generator:
              description: The agent that generates the workspace's briefs (RFC 0007).
              $ref: '#/components/schemas/ToOne'
        links:
          $ref: '#/components/schemas/SelfLinks'
        meta:
          type: object
          additionalProperties: true
    WorkspaceDocument:
      type: object
      required:
      - jsonapi
      - data
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          $ref: '#/components/schemas/Workspace'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    WorkspaceUpdateDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - id
          properties:
            type:
              type: string
              const: workspaces
            id:
              $ref: '#/components/schemas/WorkspaceId'
            attributes:
              type: object
              properties:
                name:
                  type: string
                handle:
                  type: string
                  description: Owners only.
                default_timezone:
                  $ref: '#/components/schemas/TimeZone'
                max_agents_per_member:
                  type: integer
                  minimum: 0
                max_assistants_per_member:
                  type: integer
                  minimum: 0
                brief_daily_limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                semantic_search:
                  type: boolean
                subscription_approval:
                  type: boolean
            relationships:
              type: object
              properties:
                brief_generator:
                  $ref: '#/components/schemas/ToOneRequired'
    InvitationStatus:
      type: string
      enum:
      - pending
      - accepted
      - revoked
      - expired
    Invitation:
      type: object
      required:
      - type
      - id
      - attributes
      - relationships
      - links
      properties:
        type:
          type: string
          const: invitations
        id:
          $ref: '#/components/schemas/InvitationId'
        attributes:
          type: object
          required:
          - email
          - role
          - status
          - expires_at
          - created_at
          properties:
            email:
              type: string
              format: email
            role:
              $ref: '#/components/schemas/MemberRole'
            status:
              $ref: '#/components/schemas/InvitationStatus'
            expires_at:
              description: 7 days after the invitation was sent, or last resent.
              $ref: '#/components/schemas/Timestamp'
            created_at:
              $ref: '#/components/schemas/Timestamp'
        relationships:
          type: object
          required:
          - invited_by
          - spaces
          properties:
            invited_by:
              $ref: '#/components/schemas/ToOneRequired'
            spaces:
              description: For a guest, the spaces they are added to on joining.
              $ref: '#/components/schemas/ToMany'
        links:
          $ref: '#/components/schemas/SelfLinks'
        meta:
          type: object
          additionalProperties: true
    InvitationDocument:
      type: object
      required:
      - jsonapi
      - data
      - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiVersion'
        data:
          $ref: '#/components/schemas/Invitation'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    InvitationCollectionDocument:
      type: object
      required:
      - jsonapi
      - data
      - links
      - meta
