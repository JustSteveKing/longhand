      summary: Request a brief, or roll up a thread
      description: 'Requests a generated catch-up (RFC 0007), as action `brief.request`.

        With `scope: thread` and `audience: thread` it rolls the thread up

        for everyone who can see it, as action `thread.roll_up`.


        The response is `202 Accepted` with the brief in status `queued`

